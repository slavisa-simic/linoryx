server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Let the frontend start even when the API container is stopped.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_url http://api:8080;
        proxy_pass $api_url;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
