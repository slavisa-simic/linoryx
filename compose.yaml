name: linoryx

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linoryx_db}
      POSTGRES_USER: ${POSTGRES_USER:-linoryx_api_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: linoryx-api:local
    env_file:
      - ./linoryx-api/.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-linoryx_db}
      DB_USERNAME: ${POSTGRES_USER:-linoryx_api_user}
      DB_PASSWORD: ${DB_PASSWORD}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: linoryx-web:local
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_started
        restart: true

volumes:
  postgres_data:
