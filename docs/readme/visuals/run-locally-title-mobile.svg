
    <svg xmlns="http://www.w3.org/2000/svg"
      width="400" height="88" viewBox="0 0 400 88"
      role="img" aria-label="Run locally">
      <title>Run locally</title>
      <defs>
        <clipPath id="banner-crop">
          <rect width="400" height="88" rx="12"/>
        </clipPath>
      </defs>
      <g clip-path="url(#banner-crop)">
        <image href="data:image/png;base64," width="400" height="88"/>
        <g transform="translate(248 17) scale(0.55)">
          
          <rect x="92" y="55" width="3" height="12"
            rx="1" fill="#FFFFFF">
            <animate attributeName="opacity"
              values="1;0;1" dur="1s"
              repeatCount="indefinite"/>
          </rect>
          
            <rect x="205" y="-12" width="2"
              height="15" rx="1" fill="#FFFFFF"
              opacity=".65">
              <animate attributeName="y" from="-30" to="100"
                dur="2.4s" begin="0s"
                repeatCount="indefinite"/>
            </rect>
          
            <rect x="217" y="-12" width="2"
              height="21" rx="1" fill="#FFFFFF"
              opacity=".65">
              <animate attributeName="y" from="-30" to="100"
                dur="2.9s" begin="0.5s"
                repeatCount="indefinite"/>
            </rect>
          
            <rect x="229" y="-12" width="2"
              height="27" rx="1" fill="#FFFFFF"
              opacity=".65">
              <animate attributeName="y" from="-30" to="100"
                dur="3.4s" begin="1s"
                repeatCount="indefinite"/>
            </rect>
          
        
        </g>
      </g>
    </svg>