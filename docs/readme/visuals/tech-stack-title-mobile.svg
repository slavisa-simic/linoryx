
    <svg xmlns="http://www.w3.org/2000/svg"
      width="400" height="88" viewBox="0 0 400 88"
      role="img" aria-label="Tech stack">
      <title>Tech stack</title>
      <defs>
        <clipPath id="banner-crop">
          <rect width="400" height="88" rx="12"/>
        </clipPath>
      </defs>
      <g clip-path="url(#banner-crop)">
        <image href="data:image/png;base64," width="400" height="88"/>
        <g transform="translate(248 17) scale(0.55)">
          
          <path d="M46 16H157L190 33"
            fill="none" stroke="#FFFFFF" stroke-width="2.3"
            stroke-dasharray="18 240" stroke-linecap="round">
            <animate attributeName="stroke-dashoffset"
              from="20" to="-240" dur="3.8s"
              begin="0s" repeatCount="indefinite"/>
          </path>
        
          <path d="M46 41H157L190 58"
            fill="none" stroke="#FFFFFF" stroke-width="2.3"
            stroke-dasharray="18 240" stroke-linecap="round">
            <animate attributeName="stroke-dashoffset"
              from="20" to="-240" dur="3.8s"
              begin="0.6s" repeatCount="indefinite"/>
          </path>
        
          <path d="M46 66H157L190 83"
            fill="none" stroke="#FFFFFF" stroke-width="2.3"
            stroke-dasharray="18 240" stroke-linecap="round">
            <animate attributeName="stroke-dashoffset"
              from="20" to="-240" dur="3.8s"
              begin="1.2s" repeatCount="indefinite"/>
          </path>
        
        </g>
